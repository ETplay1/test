<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketen Rechner</title>

<style>
body {
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2c2c2c;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.loading{ color:orange; }
</style>
</head>

<body>

<h1>🚀 OPSUCHT Raketen Rechner</h1>

<div class="card">

<h3>Live Marktpreise</h3>

<p>💥 Gunpowder: <span id="gunpowderPrice">lädt...</span></p>
<p>🌾 Zuckerrohr: <span id="sugarcanePrice">lädt...</span></p>

<hr>

<label>Gewünschter Gewinn pro Rakete ($)</label>
<input type="number" id="wantedProfit" value="0" step="0.01" oninput="calculate()">

<div id="output">
    <h3>Berechnung</h3>
    <p>Warte auf API...</p>
</div>

</div>

<script>

let gunpowderPrice = 0;
let sugarcanePrice = 0;

async function fetchPrice(item) {
    const res = await fetch(`https://api.opsucht.net/market/price/${item}`);
    const data = await res.json();

    console.log("API RESPONSE:", item, data); // 🔥 WICHTIG

    return data;
}

/* 🔥 findet wirklich ALLES was Preis sein könnte */
function extractPrice(obj) {

    if (typeof obj === "number") return obj;

    if (obj?.price) return obj.price;
    if (obj?.data?.price) return obj.data.price;
    if (obj?.result?.price) return obj.result.price;
    if (obj?.value) return obj.value;
    if (obj?.buyPrice) return obj.buyPrice;
    if (obj?.sellPrice) return obj.sellPrice;

    // 🔥 falls API Array liefert
    if (Array.isArray(obj)) {
        return obj[0]?.price || 0;
    }

    console.warn("KEIN PREIS GEFUNDEN:", obj);
    return 0;
}

async function loadPrices() {

    const gun = await fetchPrice("GUNPOWDER");
    const sugar = await fetchPrice("SUGAR_CANE");

    gunpowderPrice = extractPrice(gun);
    sugarcanePrice = extractPrice(sugar);

    document.getElementById("gunpowderPrice").innerText =
        gunpowderPrice + "$";

    document.getElementById("sugarcanePrice").innerText =
        sugarcanePrice + "$";

    calculate();
}

function calculate() {

    const wantedProfit =
        parseFloat(document.getElementById("wantedProfit").value) || 0;

    const recipeCost = gunpowderPrice + sugarcanePrice;
    const costPerRocket = recipeCost / 3;

    const sellPricePerRocket = costPerRocket + wantedProfit;

    document.getElementById("output").innerHTML = `
        <h3>Berechnung</h3>

        <p>Herstellungskosten: <b>${costPerRocket.toFixed(2)}$</b></p>
        <p>Gewinn pro Rakete: <b>${wantedProfit.toFixed(2)}$</b></p>

        <hr>

        <p>🚀 1: <b>${sellPricePerRocket.toFixed(2)}$</b></p>
        <p>🚀 10: <b>${(sellPricePerRocket*10).toFixed(2)}$</b></p>
        <p>📦 Stack: <b>${(sellPricePerRocket*64).toFixed(2)}$</b></p>
        <p>🎒 Shulker: <b>${(sellPricePerRocket*1728).toFixed(2)}$</b></p>
    `;
}

/* start + refresh */
loadPrices();
setInterval(loadPrices, 30000);

</script>

</body>
</html>
