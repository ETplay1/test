<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketen Rechner</title>

<style>
body {
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2c2c2c;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.profit{ color:#3ddc84; }
.loss{ color:#ff6666; }
.loading{ color:orange; }
</style>
</head>
<body>

<h1>🚀 OPSUCHT Raketen Rechner</h1>

<div class="card">

<h3>Live Marktpreise</h3>

<p>💥 Gunpowder: <span id="gunpowderPrice" class="loading">Lade...</span></p>
<p>🌾 Zuckerrohr: <span id="sugarcanePrice" class="loading">Lade...</span></p>

<hr>

<label>Gewünschter Gewinn pro Rakete ($)</label>
<input type="number" id="wantedProfit" value="0" step="0.01" oninput="calculate()">

<div id="output">
    <p>Lade Daten...</p>
</div>

</div>

<script>

let gunpowderPrice = 0;
let sugarcanePrice = 0;

async function fetchPrice(item) {
    const response = await fetch(`https://api.opsucht.net/market/price/${item}`);
    if (!response.ok) throw new Error("API Fehler");
    return await response.json();
}

async function loadPrices() {
    try {
        const gunpowderData = await fetchPrice("GUNPOWDER");
        const sugarData = await fetchPrice("SUGAR_CANE");

        gunpowderPrice = Number(
            gunpowderData.price ??
            gunpowderData.buyPrice ??
            gunpowderData.sellPrice ??
            0
        );

        sugarcanePrice = Number(
            sugarData.price ??
            sugarData.buyPrice ??
            sugarData.sellPrice ??
            0
        );

        document.getElementById("gunpowderPrice").innerText =
            gunpowderPrice.toFixed(2) + "$";

        document.getElementById("sugarcanePrice").innerText =
            sugarcanePrice.toFixed(2) + "$";

        calculate();

    } catch (e) {
        console.error(e);
        document.getElementById("gunpowderPrice").innerText = "Fehler";
        document.getElementById("sugarcanePrice").innerText = "Fehler";
    }
}

function calculate() {

    const wantedProfit =
        parseFloat(document.getElementById("wantedProfit").value) || 0;

    if (!gunpowderPrice || !sugarcanePrice) {
        document.getElementById("output").innerHTML = `
            <h3>Berechnung</h3>
            <p>Preise werden geladen...</p>
            <p>🚀 Verkauf: 0.00$</p>
        `;
        return;
    }

    const recipeCost = gunpowderPrice + sugarcanePrice;
    const costPerRocket = recipeCost / 3;

    const sellPricePerRocket = costPerRocket + wantedProfit;

    const sellPrice10 = sellPricePerRocket * 10;
    const sellPriceStack = sellPricePerRocket * 64;
    const sellPriceShulker = sellPricePerRocket * 1728;

    document.getElementById("output").innerHTML = `
        <h3>Berechnung</h3>

        <p>Herstellungskosten pro Rakete: <b>${costPerRocket.toFixed(2)}$</b></p>

        <p>Gewünschter Gewinn pro Rakete: <b>${wantedProfit.toFixed(2)}$</b></p>

        <hr>

        <p>🚀 1 Rakete: <b>${sellPricePerRocket.toFixed(2)}$</b></p>
        <p>🚀 10 Raketen: <b>${sellPrice10.toFixed(2)}$</b></p>
        <p>📦 1 Stack (64): <b>${sellPriceStack.toFixed(2)}$</b></p>
        <p>🎒 1 Shulker (1728): <b>${sellPriceShulker.toFixed(2)}$</b></p>
    `;
}

// Enter Support
document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        calculate();
    }
});

loadPrices();
setInterval(loadPrices, 60000);

</script>

</body>
</html>
