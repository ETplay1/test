<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketen Rechner</title>

<style>
body {
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2c2c2c;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.loading{ color:orange; }
.small{ opacity:0.7; }
</style>
</head>

<body>

<h1>🚀 OPSUCHT Raketen Rechner</h1>

<div class="card">

<h3>Live Marktpreise</h3>

<p>💥 Gunpowder: <span id="gunpowderPrice" class="loading">lädt...</span></p>
<p>🌾 Zuckerrohr: <span id="sugarcanePrice" class="loading">lädt...</span></p>

<hr>

<label>Gewünschter Gewinn pro Rakete ($)</label>
<input type="number" id="wantedProfit" value="0" step="0.01" oninput="calculate()">

<div id="output" class="small">
    Berechnung wird angezeigt...
</div>

</div>

<script>

let gunpowderPrice = null;
let sugarcanePrice = null;

async function fetchPrice(item) {
    const res = await fetch(`https://api.opsucht.net/market/price/${item}`);
    if (!res.ok) throw new Error("API Fehler");
    return await res.json();
}

/* 🔥 EXTREM ROBUSTE PREIS-EXTRAKTION */
function extractPrice(data) {
    return Number(
        data?.price ??
        data?.data?.price ??
        data?.result?.price ??
        data?.result?.value ??
        data?.value ??
        data?.buyPrice ??
        data?.sellPrice ??
        data?.items?.[0]?.price ??
        0
    );
}

async function loadPrices() {
    try {
        const gun = await fetchPrice("GUNPOWDER");
        const sugar = await fetchPrice("SUGAR_CANE");

        gunpowderPrice = extractPrice(gun);
        sugarcanePrice = extractPrice(sugar);

        document.getElementById("gunpowderPrice").innerText =
            gunpowderPrice ? gunpowderPrice.toFixed(2) + "$" : "0.00$";

        document.getElementById("sugarcanePrice").innerText =
            sugarcanePrice ? sugarcanePrice.toFixed(2) + "$" : "0.00$";

        calculate();

    } catch (e) {
        console.error(e);

        document.getElementById("gunpowderPrice").innerText = "Fehler";
        document.getElementById("sugarcanePrice").innerText = "Fehler";
    }
}

function calculate() {

    const wantedProfit =
        parseFloat(document.getElementById("wantedProfit").value) || 0;

    /* 🔥 Platzhalter wenn noch nichts geladen */
    if (!gunpowderPrice || !sugarcanePrice) {
        document.getElementById("output").innerHTML = `
            <h3>Berechnung</h3>
            <p>Herstellungskosten pro Rakete: <b>0.00$</b></p>

            <p>Gewünschter Gewinn pro Rakete: <b>${wantedProfit.toFixed(2)}$</b></p>

            <hr>

            <p>🚀 1 Rakete: <b>0.00$</b></p>
            <p>🚀 10 Raketen: <b>0.00$</b></p>
            <p>📦 1 Stack: <b>0.00$</b></p>
            <p>🎒 1 Shulker: <b>0.00$</b></p>
        `;
        return;
    }

    const recipeCost = gunpowderPrice + sugarcanePrice;
    const costPerRocket = recipeCost / 3;

    const sellPricePerRocket = costPerRocket + wantedProfit;

    const sellPrice10 = sellPricePerRocket * 10;
    const sellPriceStack = sellPricePerRocket * 64;
    const sellPriceShulker = sellPricePerRocket * 1728;

    document.getElementById("output").innerHTML = `
        <h3>Berechnung</h3>

        <p>Herstellungskosten pro Rakete: <b>${costPerRocket.toFixed(2)}$</b></p>

        <p>Gewünschter Gewinn pro Rakete: <b>${wantedProfit.toFixed(2)}$</b></p>

        <hr>

        <p>🚀 1 Rakete: <b>${sellPricePerRocket.toFixed(2)}$</b></p>
        <p>🚀 10 Raketen: <b>${sellPrice10.toFixed(2)}$</b></p>
        <p>📦 1 Stack: <b>${sellPriceStack.toFixed(2)}$</b></p>
        <p>🎒 1 Shulker: <b>${sellPriceShulker.toFixed(2)}$</b></p>
    `;
}

/* 🔥 Enter Support */
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") calculate();
});

/* 🚀 START + AUTO UPDATE ALLE 30 SEKUNDEN */
loadPrices();
setInterval(loadPrices, 30000);

</script>

</body>
</html>
