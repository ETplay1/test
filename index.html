<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketen Rechner</title>

<style>
body {
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2c2c2c;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.profit{ color:#3ddc84; }
.loss{ color:#ff6666; }
.loading{ color:orange; }
.small { opacity:0.8; font-size:14px; }
</style>
</head>
<body>

<h1>🚀 OPSUCHT Raketen Rechner</h1>

<div class="card">

<h3>Live Marktpreise</h3>

<p>💥 Gunpowder: <span id="gunpowderPrice" class="loading">Lade...</span></p>
<p>🌾 Zuckerrohr: <span id="sugarcanePrice" class="loading">Lade...</span></p>

<hr>

<label>Verkaufspreis pro Rakete ($)</label>
<input type="number" id="rocketPrice" value="30" step="0.01" onchange="calculate()">

<div id="output">
    <p class="small">Noch keine Berechnung...</p>
</div>

</div>

<script>

let gunpowderPrice = 0;
let sugarcanePrice = 0;

async function fetchPrice(item) {
    const response = await fetch(`https://api.opsucht.net/market/price/${item}`);
    if (!response.ok) throw new Error("API Fehler");
    return await response.json();
}

async function loadPrices() {
    try {
        const gunpowderData = await fetchPrice("GUNPOWDER");
        const sugarData = await fetchPrice("SUGAR_CANE");

        gunpowderPrice = gunpowderData.price ?? gunpowderData.buyPrice ?? gunpowderData.sellPrice ?? 0;
        sugarcanePrice = sugarData.price ?? sugarData.buyPrice ?? sugarData.sellPrice ?? 0;

        document.getElementById("gunpowderPrice").innerText = gunpowderPrice.toFixed(2) + "$";
        document.getElementById("sugarcanePrice").innerText = sugarcanePrice.toFixed(2) + "$";

        calculate();

    } catch (e) {
        console.error(e);
        document.getElementById("gunpowderPrice").innerText = "Fehler";
        document.getElementById("sugarcanePrice").innerText = "Fehler";
    }
}

function calculate() {

    const rocketPrice = parseFloat(document.getElementById("rocketPrice").value) || 0;

    if (gunpowderPrice === 0 || sugarcanePrice === 0) {
        document.getElementById("output").innerHTML = `<p class="small">Preise werden geladen...</p>`;
        return;
    }

    // 1 Rakete = 1 Gunpowder + 1 Zuckerrohr / 3 Output
    const costPerRocket = (gunpowderPrice + sugarcanePrice) / 3;

    const profitPerRocket = rocketPrice - costPerRocket;

    const profit1 = profitPerRocket * 1;
    const profit10 = profitPerRocket * 10;
    const profitStack = profitPerRocket * 64;

    const css = profitPerRocket >= 0 ? "profit" : "loss";

    const sellPricePerRocket = rocketPrice;
    const sellPrice10 = rocketPrice * 10;
    const sellPriceStack = rocketPrice * 64;

    document.getElementById("output").innerHTML = `
        <h3>Berechnung</h3>

        <p>Herstellungskosten pro Rakete: <b>${costPerRocket.toFixed(2)}$</b></p>

        <p>Gewinn pro Rakete:
        <span class="${css}"><b>${profitPerRocket.toFixed(2)}$</b></span></p>

        <hr>

        <h4>Verkauf Übersicht</h4>

        <p>1 Rakete verkaufen: <b>${sellPricePerRocket.toFixed(2)}$</b></p>
        <p>10 Raketen verkaufen: <b>${sellPrice10.toFixed(2)}$</b></p>
        <p>1 Stack (64) verkaufen: <b>${sellPriceStack.toFixed(2)}$</b></p>

        <hr>

        <p>Gewinn 1: <span class="${css}">${profit1.toFixed(2)}$</span></p>
        <p>Gewinn 10: <span class="${css}">${profit10.toFixed(2)}$</span></p>
        <p>Gewinn Stack: <span class="${css}">${profitStack.toFixed(2)}$</span></p>
    `;
}

loadPrices();
setInterval(loadPrices, 60000);

</script>

</body>
</html>
