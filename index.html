<label>Gewünschter Gewinn pro Rakete ($)</label>
<input
    type="number"
    id="wantedProfit"
    value="10"
    step="0.01"
    onchange="calculate()"
>

<div id="output"></div>

<script>

function calculate() {

    const wantedProfit =
        parseFloat(
            document.getElementById(
                "wantedProfit"
            ).value
        ) || 0;

    /*
     * 1 Gunpowder + 1 Zuckerrohr
     * = 3 Raketen
     */

    const recipeCost =
        gunpowderPrice +
        sugarcanePrice;

    const costPerRocket =
        recipeCost / 3;

    const sellPricePerRocket =
        costPerRocket +
        wantedProfit;

    const sellPrice10 =
        sellPricePerRocket * 10;

    const sellPriceStack =
        sellPricePerRocket * 64;

    const sellPriceShulker =
        sellPricePerRocket * 1728;

    document.getElementById(
        "output"
    ).innerHTML = `
        <h3>Verkaufspreise</h3>

        <p>Herstellungskosten pro Rakete:
        <b>${costPerRocket.toFixed(2)}$</b></p>

        <p>💰 Gewünschter Gewinn:
        <b>${wantedProfit.toFixed(2)}$</b></p>

        <hr>

        <p>🚀 Preis für 1 Rakete:
        <b>${sellPricePerRocket.toFixed(2)}$</b></p>

        <p>🚀 Preis für 10 Raketen:
        <b>${sellPrice10.toFixed(2)}$</b></p>

        <p>📦 Preis für 1 Stack (64):
        <b>${sellPriceStack.toFixed(2)}$</b></p>

        <p>🎒 Preis für 1 Shulker (1728):
        <b>${sellPriceShulker.toFixed(2)}$</b></p>
    `;
}

</script>
