<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketen Rechner</title>

<style>
body {
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2c2c2c;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.loading{ color:orange; }
</style>
</head>

<body>

<h1>🚀 OPSUCHT Raketen Rechner</h1>

<div class="card">

<h3>Live Marktpreise</h3>

<p>💥 Gunpowder: <span id="gunpowderPrice" class="loading">Lade...</span></p>
<p>🌾 Zuckerrohr: <span id="sugarcanePrice" class="loading">Lade...</span></p>

<hr>

<label>Gewünschter Gewinn pro Rakete ($)</label>
<input type="number" id="wantedProfit" value="0" step="0.01">

<div id="output">Lade...</div>

</div>

<script>

let gunpowderPrice = null;
let sugarcanePrice = null;

async function fetchPrice(item) {
    const res = await fetch(`https://api.opsucht.net/market/price/${item}`);
    return await res.json();
}

// 🔥 safe price reader
function extractPrice(data) {
    return Number(
        data?.price ??
        data?.data?.price ??
        data?.buyPrice ??
        data?.sellPrice ??
        0
    );
}

async function loadPrices() {
    try {
        const gun = await fetchPrice("GUNPOWDER");
        const sugar = await fetchPrice("SUGAR_CANE");

        gunpowderPrice = extractPrice(gun);
        sugarcanePrice = extractPrice(sugar);

        document.getElementById("gunpowderPrice").innerText =
            gunpowderPrice.toFixed(2) + "$";

        document.getElementById("sugarcanePrice").innerText =
            sugarcanePrice.toFixed(2) + "$";

        calculate();

    } catch (e) {
        document.getElementById("gunpowderPrice").innerText = "Fehler";
        document.getElementById("sugarcanePrice").innerText = "Fehler";
    }
}

function calculate() {

    const wantedProfit =
        parseFloat(document.getElementById("wantedProfit").value) || 0;

    if (gunpowderPrice === null || sugarcanePrice === null) {
        document.getElementById("output").innerHTML = `
Berechnung
Herstellungskosten pro Rakete: 0.00$

Gewünschter Gewinn pro Rakete: ${wantedProfit.toFixed(2)}$

🚀 Verkauf 1: 0.00$
🚀 Verkauf 10: 0.00$
📦 Stack: 0.00$
🎒 Shulker: 0.00$
        `;
        return;
    }

    const recipeCost = gunpowderPrice + sugarcanePrice;
    const costPerRocket = recipeCost / 3;

    const sellPricePerRocket = costPerRocket + wantedProfit;

    const sellPrice10 = sellPricePerRocket * 10;
    const sellPriceStack = sellPricePerRocket * 64;
    const sellPriceShulker = sellPricePerRocket * 1728;

    document.getElementById("output").innerHTML = `
Berechnung
Herstellungskosten pro Rakete: ${costPerRocket.toFixed(2)}$

Gewünschter Gewinn pro Rakete: ${wantedProfit.toFixed(2)}$

🚀 Verkaufspreis für 1 Rakete: ${sellPricePerRocket.toFixed(2)}$

🚀 Verkaufspreis für 10 Raketen: ${sellPrice10.toFixed(2)}$

📦 Verkaufspreis für 1 Stack: ${sellPriceStack.toFixed(2)}$

🎒 Verkaufspreis für 1 Shulker: ${sellPriceShulker.toFixed(2)}$
    `;
}

// Enter Support
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") calculate();
});

loadPrices();
setInterval(loadPrices, 60000);

</script>

</body>
</html>
