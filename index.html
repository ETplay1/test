<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketen Rechner</title>

<style>
body {
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2c2c2c;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.profit{
    color:#3ddc84;
}

.loss{
    color:#ff6666;
}

.loading{
    color:orange;
}
</style>
</head>
<body>

<h1>🚀 OPSUCHT Raketen Rechner</h1>

<div class="card">

<h3>Live Marktpreise</h3>

<p>💥 Gunpowder: <span id="gunpowderPrice" class="loading">Lade...</span></p>
<p>🌾 Zuckerrohr: <span id="sugarcanePrice" class="loading">Lade...</span></p>

<hr>

<label>Verkaufspreis pro Rakete ($)</label>
<input
    type="number"
    id="rocketPrice"
    value="30"
    step="0.01"
    onchange="calculate()"
>

<div id="output"></div>

</div>

<script>

let gunpowderPrice = 0;
let sugarcanePrice = 0;

async function fetchPrice(item) {

    const response = await fetch(
        `https://api.opsucht.net/market/price/${item}`
    );

    if (!response.ok) {
        throw new Error("API Fehler");
    }

    return await response.json();
}

async function loadPrices() {

    try {

        const gunpowderData =
            await fetchPrice("GUNPOWDER");

        const sugarData =
            await fetchPrice("SUGAR_CANE");

        /*
         * API Struktur eventuell anpassen:
         * gunpowderData.price
         * gunpowderData.sellPrice
         * gunpowderData.buyPrice
         */

        gunpowderPrice =
            gunpowderData.price ??
            gunpowderData.buyPrice ??
            gunpowderData.sellPrice;

        sugarcanePrice =
            sugarData.price ??
            sugarData.buyPrice ??
            sugarData.sellPrice;

        document.getElementById(
            "gunpowderPrice"
        ).innerText =
            gunpowderPrice.toFixed(2) + "$";

        document.getElementById(
            "sugarcanePrice"
        ).innerText =
            sugarcanePrice.toFixed(2) + "$";

        calculate();

    } catch (e) {

        console.error(e);

        document.getElementById(
            "gunpowderPrice"
        ).innerText =
            "Fehler";

        document.getElementById(
            "sugarcanePrice"
        ).innerText =
            "Fehler";
    }
}

function calculate() {

    const rocketPrice =
        parseFloat(
            document.getElementById(
                "rocketPrice"
            ).value
        );

    /*
     * 3 Zuckerrohr -> 3 Papier
     * 1 Papier + 1 Gunpowder -> 3 Raketen
     *
     * => 1 Zuckerrohr + 1 Gunpowder
     * => 3 Raketen
     */

    const recipeCost =
        gunpowderPrice +
        sugarcanePrice;

    const costPerRocket =
        recipeCost / 3;

    const profitPerRocket =
        rocketPrice -
        costPerRocket;

    const profitPerStack =
        profitPerRocket * 64;

    const css =
        profitPerRocket >= 0
        ? "profit"
        : "loss";

    document.getElementById(
        "output"
    ).innerHTML = `
        <h3>Berechnung</h3>

        <p>Herstellungskosten pro Rakete:
        <b>${costPerRocket.toFixed(2)}$</b></p>

        <p>Gewinn pro Rakete:
        <span class="${css}">
        <b>${profitPerRocket.toFixed(2)}$</b>
        </span></p>

        <p>Gewinn pro Stack:
        <span class="${css}">
        <b>${profitPerStack.toFixed(2)}$</b>
        </span></p>
    `;
}

loadPrices();

setInterval(loadPrices, 60000);

</script>

</body>
</html>
