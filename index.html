<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketen Rechner</title>

<style>
body{
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2c2c2c;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:none;
    border-radius:5px;
}

.loading{
    color:orange;
}

.success{
    color:#00ff88;
}

.error{
    color:#ff6666;
}

.small{
    color:#aaa;
    font-size:0.9em;
}

.signcode{
    background:#111;
    border:2px solid #555;
    padding:15px;
    width:220px;
    color:white;
    font-family:monospace;
    line-height:1.8;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>🚀 OPSUCHT Raketen Rechner</h1>

<div class="card">

<h3>Live Marktpreise</h3>

<p>
💥 Gunpowder:
<b id="gunpowderPrice" class="loading">Lade...</b>
</p>

<p>
🌾 Zuckerrohr:
<b id="sugarcanePrice" class="loading">Lade...</b>
</p>

<p class="small">
Preisquelle: OPSUCHT Market API
</p>

<hr>

<label>Gewünschter Gewinn pro Rakete ($)</label>

<input
type="number"
id="wantedProfit"
value="0"
step="0.01"
oninput="calculate()"
>

</div>

<div class="card">
<div id="output">
<h3>Berechnung</h3>
<p>Warte auf API...</p>
</div>
</div>

<script>

let gunpowderPrice = 0;
let sugarcanePrice = 0;

async function getBuyPrice(item){

    const response = await fetch(
        `https://api.opsucht.net/market/price/${item}`
    );

    const data = await response.json();

    const buyOrder = data[item].find(
        entry => entry.orderSide === "BUY"
    );

    return buyOrder.price;
}

async function loadPrices(){

    try{

        gunpowderPrice = await getBuyPrice("GUNPOWDER");
        sugarcanePrice = await getBuyPrice("SUGAR_CANE");

        document.getElementById("gunpowderPrice").innerText =
            gunpowderPrice.toFixed(2) + "$";

        document.getElementById("gunpowderPrice").className =
            "success";

        document.getElementById("sugarcanePrice").innerText =
            sugarcanePrice.toFixed(2) + "$";

        document.getElementById("sugarcanePrice").className =
            "success";

        calculate();

    }catch(err){

        document.getElementById("output").innerHTML = `
            <h3>Fehler</h3>
            <p class="error">
                API konnte nicht geladen werden.
            </p>
        `;
    }
}

function calculate(){

    if(gunpowderPrice <= 0 || sugarcanePrice <= 0){
        return;
    }

    const wantedProfit =
        parseFloat(
            document.getElementById("wantedProfit").value
        ) || 0;

    const recipeCost =
        gunpowderPrice +
        sugarcanePrice;

    const costPerRocket =
        recipeCost / 3;

    const sellPricePerRocket =
        costPerRocket +
        wantedProfit;

    const stackPrice =
        sellPricePerRocket * 64;

    document.getElementById("output").innerHTML = `

        <h3>Berechnung</h3>

        <p>
            Gunpowder Preis:
            <b>${gunpowderPrice.toFixed(2)}$</b>
        </p>

        <p>
            Zuckerrohr Preis:
            <b>${sugarcanePrice.toFixed(2)}$</b>
        </p>

        <hr>

        <p>
            Herstellungskosten pro Rakete:
            <b>${costPerRocket.toFixed(2)}$</b>
        </p>

        <p>
            Gewünschter Gewinn:
            <b>${wantedProfit.toFixed(2)}$</b>
        </p>

        <hr>

        <p>
            🚀 Einzelrakete:
            <b>${sellPricePerRocket.toFixed(2)}$</b>
        </p>

        <p>
            🚀 10 Raketen:
            <b>${(sellPricePerRocket * 10).toFixed(2)}$</b>
        </p>

        <p>
            📦 Stack (64):
            <b>${stackPrice.toFixed(2)}$</b>
        </p>

        <p>
            🎒 Shulkerkiste (1728):
            <b>${(sellPricePerRocket * 1728).toFixed(2)}$</b>
        </p>

        <hr>

        <h3>Signcode</h3>

        <div class="signcode">
            <div>redtech236</div>
            <div>64</div>
            <div>B ${stackPrice.toFixed(2)}$</div>
            <div>?</div>
        </div>

    `;
}

loadPrices();

setInterval(loadPrices,30000);

</script>

</body>
</html>
