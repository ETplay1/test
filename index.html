<label>Gewünschter Gewinn pro Rakete ($)</label>
<input
    type="number"
    id="wantedProfit"
    value="10"
    step="0.01"
    onchange="calculate()"
>

<div id="output"></div>

<script>

let gunpowderPrice = 0;
let sugarcanePrice = 0;

async function fetchPrice(item) {

    const response = await fetch(
        `https://api.opsucht.net/market/price/${item}`
    );

    if (!response.ok) {
        throw new Error("API Fehler");
    }

    return await response.json();
}

async function loadPrices() {

    try {

        const gunpowderData =
            await fetchPrice("GUNPOWDER");

        const sugarData =
            await fetchPrice("SUGAR_CANE");

        gunpowderPrice =
            gunpowderData.price ??
            gunpowderData.buyPrice ??
            gunpowderData.sellPrice;

        sugarcanePrice =
            sugarData.price ??
            sugarData.buyPrice ??
            sugarData.sellPrice;

        document.getElementById(
            "gunpowderPrice"
        ).innerText =
            gunpowderPrice.toFixed(2) + "$";

        document.getElementById(
            "sugarcanePrice"
        ).innerText =
            sugarcanePrice.toFixed(2) + "$";

        calculate();

    } catch (e) {

        console.error(e);

        document.getElementById(
            "gunpowderPrice"
        ).innerText = "Fehler";

        document.getElementById(
            "sugarcanePrice"
        ).innerText = "Fehler";
    }
}

function calculate() {

    const wantedProfit =
        parseFloat(
            document.getElementById(
                "wantedProfit"
            ).value
        ) || 0;

    const recipeCost =
        gunpowderPrice +
        sugarcanePrice;

    const costPerRocket =
        recipeCost / 3;

    const sellPricePerRocket =
        costPerRocket +
        wantedProfit;

    const sellPrice10 =
        sellPricePerRocket * 10;

    const sellPriceStack =
        sellPricePerRocket * 64;

    const sellPriceShulker =
        sellPricePerRocket * 1728;

    document.getElementById(
        "output"
    ).innerHTML = `
        <h3>Verkaufspreise</h3>

        <p>Herstellungskosten pro Rakete:
        <b>${costPerRocket.toFixed(2)}$</b></p>

        <p>🚀 Preis für 1 Rakete:
        <b>${sellPricePerRocket.toFixed(2)}$</b></p>

        <p>🚀 Preis für 10 Raketen:
        <b>${sellPrice10.toFixed(2)}$</b></p>

        <p>📦 Preis für 1 Stack (64):
        <b>${sellPriceStack.toFixed(2)}$</b></p>

        <p>🎒 Preis für 1 Shulker (1728):
        <b>${sellPriceShulker.toFixed(2)}$</b></p>
    `;
}

loadPrices();

setInterval(loadPrices, 60000);

</script>
