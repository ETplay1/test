<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPSUCHT Raketenrechner</title>

<style>
body {
    background: #1e1e1e;
    color: #ffffff;
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #2c2c2c;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 5px;
    border: none;
}

.profit {
    color: #00ff88;
}

.loss {
    color: #ff6666;
}

.loading {
    color: orange;
}

.small {
    color: #bbbbbb;
    font-size: 0.9em;
}
</style>

</head>
<body>

<h1>🚀 OPSUCHT Raketenrechner</h1>

<div class="card">

<h2>Aktuelle Marktpreise</h2>

<p>
💥 Gunpowder:
<strong id="gunpowderPrice" class="loading">Lade...</strong>
</p>

<p>
🌾 Zuckerrohr:
<strong id="sugarcanePrice" class="loading">Lade...</strong>
</p>

<p class="small">
Preise werden automatisch alle 60 Sekunden aktualisiert.
</p>

</div>

<div class="card">

<h2>Verkaufspreis</h2>

<label>Verkaufspreis pro Rakete ($)</label>

<input
    id="rocketPrice"
    type="number"
    value="10"
    step="0.01"
    onchange="calculate()"
    onkeyup="calculate()"
>

</div>

<div class="card">

<h2>Berechnung</h2>

<div id="output">
Warte auf Marktdaten...
</div>

</div>

<script>

let gunpowderPrice = 0;
let sugarcanePrice = 0;

async function getMarketPrice(item) {

    const response = await fetch(
        `https://api.opsucht.net/market/price/${item}`
    );

    if (!response.ok) {
        throw new Error("API Fehler");
    }

    const data = await response.json();

    const orders = data[item];

    const buyOrder = orders.find(
        o => o.orderSide === "BUY"
    );

    if (!buyOrder) {
        throw new Error(
            `Kein BUY Preis für ${item}`
        );
    }

    return buyOrder.price;
}

async function loadPrices() {

    try {

        gunpowderPrice =
            await getMarketPrice("GUNPOWDER");

        sugarcanePrice =
            await getMarketPrice("SUGAR_CANE");

        document.getElementById(
            "gunpowderPrice"
        ).innerText =
            gunpowderPrice.toFixed(2) + "$";

        document.getElementById(
            "sugarcanePrice"
        ).innerText =
            sugarcanePrice.toFixed(2) + "$";

        calculate();

    } catch (error) {

        console.error(error);

        document.getElementById(
            "gunpowderPrice"
        ).innerText = "Fehler";

        document.getElementById(
            "sugarcanePrice"
        ).innerText = "Fehler";

        document.getElementById(
            "output"
        ).innerHTML =
            "<p>Fehler beim Laden der Marktpreise.</p>";
    }
}

function calculate() {

    if (
        gunpowderPrice === 0 ||
        sugarcanePrice === 0
    ) {
        return;
    }

    const rocketPrice = parseFloat(
        document.getElementById(
            "rocketPrice"
        ).value
    );

    /*
     * Minecraft:
     * 1 Gunpowder
     * 1 Papier
     * =
     * 3 Raketen
     *
     * 3 Zuckerrohr -> 3 Papier
     * => 1 Zuckerrohr = 1 Papier
     */

    const recipeCost =
        gunpowderPrice +
        sugarcanePrice;

    const costPerRocket =
        recipeCost / 3;

    const profitPerRocket =
        rocketPrice - costPerRocket;

    const profitPerStack =
        profitPerRocket * 64;

    const profitPerShulker =
        profitPerStack * 27;

    const css =
        profitPerRocket >= 0
            ? "profit"
            : "loss";

    document.getElementById(
        "output"
    ).innerHTML = `

        <p>
        Herstellungskosten pro Rakete:
        <strong>
        ${costPerRocket.toFixed(2)}$
        </strong>
        </p>

        <p>
        Gewinn pro Rakete:
        <span class="${css}">
        <strong>
        ${profitPerRocket.toFixed(2)}$
        </strong>
        </span>
        </p>

        <p>
        Gewinn pro Stack (64):
        <span class="${css}">
        <strong>
        ${profitPerStack.toFixed(2)}$
        </strong>
        </span>
        </p>

        <p>
        Gewinn pro Shulkerkiste (27 Stacks):
        <span class="${css}">
        <strong>
        ${profitPerShulker.toFixed(2)}$
        </strong>
        </span>
        </p>

    `;
}

loadPrices();

/* alle 60 Sekunden aktualisieren */
setInterval(loadPrices, 60000);

</script>

</body>
</html>
